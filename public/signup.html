<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="top-bar">
    <div class="top-bar-inner">
      <a class="logo" href="/">Sarcyn Cinema</a>
      <nav class="menu">
        <a href="/#now-showing">Now Showing</a>
        <a href="/#coming-soon">Upcoming Shows</a>
      </nav>
      <div class="auth-buttons"></div>
    </div>
  </header>

  <main class="form-page">
    <div class="form-card">

      <h1>Join Sarcyn Cinema</h1>
      <p class="form-intro">Create an account to start booking.</p>

      <p class="form-message hidden" id="form-message"></p>

      <form id="signup-form" novalidate>

        <div class="form-field">
          <label for="fullname">Full name</label>
          <input id="fullname" name="fullname" type="text" placeholder="Juan Dela Cruz" autocomplete="name" required>
        </div>

        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="juandelacruz@gmail.com" autocomplete="email" required>
        </div>

        <div class="form-field">
          <label for="mobile">Mobile number</label>
          <input id="mobile" name="mobile" type="tel" placeholder="0917 123 4567" autocomplete="tel">
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
            <button class="password-toggle" type="button" aria-pressed="false"
                    aria-label="Show password" hidden>
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="form-field">
          <label for="confirm">Confirm password</label>
          <div class="password-field">
            <input id="confirm" name="confirm" type="password" placeholder="Re-type your password" autocomplete="new-password" required>
            <button class="password-toggle" type="button" aria-pressed="false"
                    aria-label="Show password" hidden>
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <label class="agree-line">
          <input type="checkbox" id="agree" name="agree" required>
          <span>I agree to the <a href="/terms">Terms of Service</a>.</span>
        </label>

        <button class="button button-red" type="submit" id="submit">Create Account</button>

      </form>

      <p class="form-switch">Already have an account? <a href="/signin" id="signin-link">Sign In</a></p>

    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a class="logo" href="/">Sarcyn Cinema</a>
      <p class="footer-text">
        Your next movie experience starts here. <br>
        Book your seats, enjoy your snacks, and let the show begin.
      </p>
      <p class="footer-copyright">© 2026 Sarcyn Cinema. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
